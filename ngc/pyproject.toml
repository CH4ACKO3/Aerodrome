[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "aerodrome-ngc-prototype"
version = "0.1.0.dev0"
description = "Reviewable Python/JAX navigation, guidance and control architecture"
requires-python = ">=3.14,<3.15"
dependencies = [
    "jax>=0.11.1,<0.12",
    "numpy>=2.5.3,<3",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.3,<7",
    "scipy>=1.18.1,<2",
]

[project.optional-dependencies]
test = ["pytest>=9.1.1,<10"]
control = [
    "control>=0.10.2,<0.11",
]
hydra = [
    "hydra-core==1.3.6",
]
gym = [
    "gymnasium>=1.2,<2",
]

[project.scripts]
aerodrome = "aerodrome.configuration.cli:main"
aerodrome-hydra = "aerodrome.configuration.hydra_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aerodrome"]

[tool.hatch.build]
exclude = ["/artifacts", "/dist", "/.venv", "/.pytest_cache", "**/__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
